<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUPER M ELECTRONICS</title>
<meta name="description" content="Your Trusted Destination for Electronics. Connect with SUPER M ELECTRONICS.">
<meta name="theme-color" content="#080808">
<style>
:root{--gold:#C9A13B;--gold-l:#E8CB78;--black:#080808;--card:#121212;--line:rgba(201,161,59,.28);--white:#fff;--muted:#b9b4a6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,rgba(201,161,59,.18),transparent 60%),var(--black);color:var(--white);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;padding:32px 18px}
main{width:100%;max-width:460px;text-align:center;display:flex;flex-direction:column;align-items:center}
.logo{width:min(300px,78%);padding:14px;border-radius:26px;background:#fff;border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(201,161,59,.08),0 18px 40px rgba(0,0,0,.7);animation:glow 3.5s ease-in-out infinite}
.logo img{display:block;width:100%;height:auto;border-radius:16px}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(201,161,59,.13),0 0 38px rgba(201,161,59,.35),0 18px 40px rgba(0,0,0,.7)}}
.brand{margin:20px 0 0;font-size:.85rem;letter-spacing:.42em;color:var(--gold);font-weight:600;text-transform:uppercase}
h1{margin:26px 0 8px;font-size:clamp(1.7rem,6.5vw,2.2rem);line-height:1.15;font-weight:700;background:linear-gradient(90deg,#fff,var(--gold-l) 50%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;color:var(--muted);font-size:1.02rem}
.rule{width:84px;height:2px;margin:24px auto 28px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.links{width:100%;display:grid;gap:14px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 20px;border-radius:16px;text-decoration:none;color:var(--white);font-size:1.05rem;font-weight:600;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.55);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;-webkit-tap-highlight-color:transparent}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(232,203,120,.22) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s ease}
.btn:hover,.btn:focus-visible{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.65),0 0 22px rgba(201,161,59,.25)}
.btn:hover::after,.btn:focus-visible::after{transform:translateX(120%)}
.btn:focus-visible{outline:3px solid var(--gold-l);outline-offset:3px}
.btn:active{transform:translateY(0) scale(.99)}
.ico{flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(201,161,59,.12);color:var(--gold)}
.ico svg{width:22px;height:22px;fill:currentColor}
.txt{flex:1;text-align:left}
.txt small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
.arrow{color:var(--gold);font-size:1.3rem;transition:transform .25s}
.btn:hover .arrow{transform:translateX(4px)}
.btn.wa{min-height:76px;font-size:1.15rem;color:#080808;background:linear-gradient(135deg,var(--gold-l),var(--gold) 55%,#a8801f);border:0;box-shadow:0 12px 30px rgba(201,161,59,.35);animation:pulse 2.8s ease-in-out infinite}
.btn.wa .ico{background:rgba(8,8,8,.14);color:#080808}
.btn.wa small,.btn.wa .arrow{color:rgba(8,8,8,.7)}
.btn.wa:hover{box-shadow:0 16px 38px rgba(201,161,59,.5)}
@keyframes pulse{50%{box-shadow:0 12px 40px rgba(201,161,59,.55)}}
.btn.loc{background:transparent;border:1.5px solid var(--gold);color:var(--gold-l)}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);width:100%;color:var(--muted);font-size:.82rem}
@media(min-width:768px){body{align-items:center;padding:56px 24px}main{max-width:520px}.logo{width:340px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
